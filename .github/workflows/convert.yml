name: Ruleset Auto Update

on:
  schedule:
    - cron: '0 17 * * *' # 每天 UTC 17:00 (北京时间 01:00) 执行

  # 允许手动触发，方便测试
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_ruleset:
    runs-on: ubuntu-latest
    
    # Git 配置，用于后续的 push 操作
    env:
      GIT_COMMITTER_NAME: GitHub Actions Bot
      GIT_COMMITTER_EMAIL: actions@github.com

    steps:
      # 0. Checkout code
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          # 必须配置 token 以允许后续的 push
          token: ${{ secrets.GITHUB_TOKEN }}
          
      # 1. 下载、解压、重命名并赋予执行权限 mihomo
      - name: 📥 Download and Setup Mihomo
        run: |
          # 下载压缩包
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-linux-amd64-compatible-v1.19.16.gz"
          curl -L $MIHOMO_URL -o mihomo.gz
          
          # 解压
          gunzip mihomo.gz

          # 赋予执行权限
          chmod +x mihomo
          
      # 2. 下载 rules 并生成 block_merged.yaml
      - name: ⬇️ Download and Merge Block Rules
        run: |
          RULES_URL="https://github.com/Loyalsoldier/clash-rules/raw/refs/heads/release/proxy.txt"
          curl -L $RULES_URL -o proxy.txt
          python3 scripts/build-block.py
          
      # 3. 执行 mihomo convert-ruleset 命令
      - name: 🛠️ Convert Ruleset
        run: |
          ./mihomo convert-ruleset domain yaml proxy.txt mrs/proxy.mrs
          ./mihomo convert-ruleset domain yaml block_merged.yaml mrs/block.mrs
          
      # 4. Commit and Push changes
      - name: 📤 Commit and Push Rulesets
        run: |
          # 配置 Git user
          git config user.name "${{ env.GIT_COMMITTER_NAME }}"
          git config user.email "${{ env.GIT_COMMITTER_EMAIL }}"
          
          # 添加生成的文件
          git add mrs/proxy.mrs mrs/block.mrs
          
          # 检查是否有改动需要提交
          if git diff --cached --quiet; then
            echo "No changes in rulesets. Skipping commit."
          else
            git commit -m "🤖 Auto update rulesets"
            git push
            echo "Successfully committed and pushed."
          fi
